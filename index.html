    <script>
      // Suppress Vite HMR / WebSocket connection errors in iframe environment
      window.addEventListener('error', function(e) {
        if (
          (e.filename && e.filename.includes('@vite/client')) ||
          (e.message && (e.message.includes('WebSocket') || e.message.includes('vite-hmr')))
        ) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason ? String(e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('vite-hmr') || reason.includes('@vite/client')) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>

    <div id="root"></div>
